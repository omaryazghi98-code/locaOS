<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>locaOS NAVI Experiment</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #09090b; color: #f4f4f5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; }
      #root { min-height: 100vh; }
      .boot-check { min-height: 100vh; display: grid; place-items: center; padding: 32px; box-sizing: border-box; }
      .boot-card { max-width: 720px; padding: 48px; border: 1px solid #27272a; border-radius: 24px; background: #111113; text-align: center; }
      .boot-card h1 { margin: 14px 0 12px; font-size: 42px; }
      .boot-card p { margin: 0; color: #a1a1aa; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-check">
        <section class="boot-card">
          <div>locaOS / NAVI</div>
          <h1>Blink preview is serving HTML.</h1>
          <p>If you can see this, Vite and the Blink preview proxy are working. React boot is the next layer.</p>
        </section>
      </main>
    </div>
    <noscript>JavaScript is required for the React experiment.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
